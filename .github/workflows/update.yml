name: Update projections

on:
  schedule:
    # Every hour, at 20 past: picks up the data repo's latest refresh (it updates several times a day, more on match days)
    # and the live FPL feed for status, news and prices.
    - cron: "20 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["fplmodel/**", "scripts/**", "config/**", "site/**", ".github/workflows/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: olbauday/FPL-Core-Insights
          path: core
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run model
        env:
          FPL_SITE_PASSWORD: ${{ secrets.FPL_SITE_PASSWORD }}
        run: |
          set -o pipefail
          python scripts/run_production.py core --out _site/data 2>&1 | tee model.log || {
            echo "::error title=Model failed::$(tail -n 25 model.log | tr '\n' '|' | cut -c1-3000)"
            exit 1
          }
      - name: Assemble site
        run: cp site/index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
