<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c0f14">
<title>Campbell FPL v2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#edeff5; --card:#ffffff; --card2:#f4f6fa; --ink:#11141c; --ink2:#5a6475; --line:#dde2ec;
  --gkp:#b7791f; --def:#1f6fd6; --mid:#0e8a5f; --fwd:#d6334f; --on-pos:#ffffff;
  --warn:#b7791f; --bad:#d6334f; --focus:#1f6fd6; --glass:rgba(255,255,255,.72);
  --body:'Barlow',system-ui,sans-serif; --num:'Barlow Semi Condensed','Barlow',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c0f14; --card:#151a22; --card2:#1c232d; --ink:#eaeef5; --ink2:#8c97a8; --line:#232b36;
  --gkp:#f5b544; --def:#4fa3ff; --mid:#36d399; --fwd:#ff6f8e; --on-pos:#0c0f14;
  --warn:#f5b544; --bad:#ff6f8e; --focus:#7aa7ff; --glass:rgba(21,26,34,.72); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0c0f14; --card:#151a22; --card2:#1c232d; --ink:#eaeef5; --ink2:#8c97a8; --line:#232b36;
  --gkp:#f5b544; --def:#4fa3ff; --mid:#36d399; --fwd:#ff6f8e; --on-pos:#0c0f14;
  --warn:#f5b544; --bad:#ff6f8e; --focus:#7aa7ff; --glass:rgba(21,26,34,.72); color-scheme:dark;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.35 var(--body);-webkit-text-size-adjust:100%}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:1040px;margin:0 auto;padding:0 12px}
.pos-GKP{--p:var(--gkp)} .pos-DEF{--p:var(--def)} .pos-MID{--p:var(--mid)} .pos-FWD{--p:var(--fwd)}

/* lock */
#lock{min-height:100svh;display:grid;place-items:center;padding:24px 16px}
#lock form{width:100%;max-width:340px}
#lock h1{font:700 2.3rem/.98 var(--num);letter-spacing:-.02em;margin:0 0 6px}
#lock p{margin:0 0 18px;color:var(--ink2)}
#lock input[type=password]{width:100%;padding:13px 14px;border:2px solid var(--ink);border-radius:12px;background:var(--card);font-size:16px}
#lock .keep{display:flex;align-items:center;gap:8px;margin:12px 0 14px;color:var(--ink2)}
#lock button[type=submit]{width:100%;padding:13px;border:0;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:600}
#lock .err{color:var(--bad);min-height:1.5em;margin-top:10px;font-weight:500}

/* top */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 8px) 0 8px}
.bar1{display:flex;align-items:center;gap:8px}
.bar1 h1{font:700 1.5rem/1 var(--num);letter-spacing:-.015em;margin:0;flex:1;white-space:nowrap}
.bar1 h1 small{font:600 .8rem var(--num);color:var(--ink2);letter-spacing:0}
.ic{width:38px;height:38px;border-radius:12px;border:0;background:var(--card);display:grid;place-items:center}
.ic svg{width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sub{color:var(--ink2);font-size:.8rem;margin:2px 0 8px}
.prog{margin-top:-6px;font-size:.72rem;opacity:.8}
.search{width:100%;height:40px;padding:0 14px;border:0;border-radius:12px;background:var(--card);font-size:16px}
.search::placeholder{color:var(--ink2)}
.bar2{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.82rem;color:var(--ink2)}
.bar2 .sp{flex:1}
.sort{display:inline-flex;background:var(--card);border-radius:10px;padding:2px}
.sort button{border:0;background:none;border-radius:8px;padding:5px 11px;font:600 .85rem var(--num);color:var(--ink2)}
.sort.wide{display:flex}.sort.wide button{flex:1;padding:10px 8px}
.sort button[aria-pressed=true]{background:var(--ink);color:var(--bg)}

/* list */
#list{display:flex;flex-direction:column;gap:4px;padding-bottom:96px}
@media (min-width:820px){#list{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item.open{grid-column:1/-1}}
.item{background:var(--card);border-radius:14px;overflow:hidden;position:relative}
.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--p)}
.row{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) 62px minmax(42px,auto);gap:6px;align-items:center;width:100%;padding:4px 8px 4px 12px;min-height:40px}
.row:focus-visible{outline:3px solid var(--focus);outline-offset:-3px;border-radius:14px}
.row>span:first-child{min-width:0}
.l1{display:flex;align-items:center;gap:5px;min-width:0}
.mt{margin-left:auto;flex:none;font:500 .72rem var(--num);color:var(--ink2);white-space:nowrap}.mt b{color:var(--ink);font-weight:600}
.nm{font:600 .95rem/1.15 var(--num);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.l2{display:flex;align-items:center;gap:6px;font:500 .8rem/1.2 var(--num);color:var(--ink2);margin-top:3px;white-space:nowrap;overflow:hidden}
.chip{font:700 .6rem/1 var(--num);padding:3px 4px;flex:none;border-radius:5px;background:var(--p);color:var(--on-pos);letter-spacing:.02em}
.l2 b{color:var(--ink);font-weight:600}
.l2 .dot{opacity:.45}
.flag{font:600 .68rem/1 var(--body);padding:2px 5px;border-radius:5px;border:1px solid currentColor;flex:none}
.yc{display:inline-grid;place-items:center;width:.62rem;height:.82rem;margin-left:4px;border-radius:2px;background:#f6c90e;color:#3a2e00;font:800 .52rem/1 var(--num);vertical-align:-1px;transform:rotate(-8deg);box-shadow:0 0 0 1px rgba(0,0,0,.25),1px 1px 2px rgba(0,0,0,.25);flex:none}
.yc.hot{background:#ffd400;box-shadow:0 0 0 1.5px #d4380d,1px 1px 2px rgba(0,0,0,.3)}
.flag.d{color:var(--warn)} .flag.o{color:var(--bad)} .flag.n{color:var(--ink2)}
.sc{min-width:0}
.nx{display:block;font:600 .6rem/1 var(--num);color:var(--ink2);margin-top:2px;text-align:center;white-space:nowrap}
.strip{display:flex;align-items:flex-end;gap:2px;height:20px}
.strip i{flex:1;background:var(--p);border-radius:2px 2px 0 0;min-height:2px;transform-origin:bottom}
.strip i.off{background:none;border:1px dashed var(--ink2);border-bottom:0;height:7px}
.strip i.out{opacity:.3}
.tot{text-align:right;line-height:1}
.tot .a{font:700 1.2rem/1 var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tot .b{font:500 .62rem/1 var(--num);color:var(--ink2);margin-top:3px;font-variant-numeric:tabular-nums}

/* detail (animated open) */
.dwrap{display:grid;grid-template-rows:0fr}
.item.open .dwrap{grid-template-rows:1fr}
.dwrap>div{overflow:hidden}
.detail{padding:4px 14px 14px;display:grid;gap:14px 28px;grid-template-columns:1fr}
@media (min-width:820px){.detail{grid-template-columns:1fr 1fr}}
.detail h3{font:600 .8rem var(--body);margin:0 0 6px;color:var(--ink2)}
.gws{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
@media (min-width:820px){.gws{grid-template-columns:repeat(8,1fr)}}
.gws>div{background:var(--card2);border-radius:9px;padding:5px 2px;text-align:center}
.gws .g{font:500 .68rem var(--num);color:var(--ink2)} .gws .e{font:700 1.05rem var(--num);color:var(--ink)} .gws .o{font:500 .68rem var(--num);color:var(--ink2);min-height:1em;white-space:nowrap}
.comp{display:grid;grid-template-columns:104px 1fr 38px;gap:4px 8px;align-items:center;font-size:.82rem}
.comp .bar{height:8px;background:var(--card2);border-radius:4px;position:relative;overflow:hidden}
.comp .bar span{position:absolute;left:0;top:0;bottom:0;background:var(--p);border-radius:4px}
.comp .bar span.neg{background:var(--bad)}
.comp .t{text-align:right;font:600 .85rem var(--num);font-variant-numeric:tabular-nums}
.info{color:var(--ink2);font-size:.8rem;margin-top:8px}
.valbox{grid-column:1/-1;background:var(--card2);border-radius:12px;padding:10px 12px}
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vgrid b{display:block;font:700 1.25rem/1 var(--num);font-variant-numeric:tabular-nums;color:var(--p)}
.vgrid span{display:block;font-size:.72rem;color:var(--ink2);line-height:1.2;margin-top:3px}

.empty{padding:30px 6px;color:var(--ink2)}
footer{padding:6px 2px 110px;color:var(--ink2);font-size:.78rem;max-width:62ch}
footer p{margin:0 0 6px}

/* bottom dock: frosted, thumb-reachable */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);pointer-events:none}
.dock .in{pointer-events:auto;max-width:560px;margin:0 auto;display:flex;gap:6px;align-items:center;padding:6px;border-radius:20px;
  background:var(--glass);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);
  border:1px solid color-mix(in srgb,var(--ink) 10%,transparent);box-shadow:0 8px 28px rgba(0,0,0,.18)}
.pchips{display:flex;gap:4px;flex:1}
.pchips button{flex:1;border:0;background:none;border-radius:14px;height:42px;font:700 .86rem var(--num);color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:5px}
.pchips button i{width:8px;height:8px;border-radius:50%;background:var(--p)}
.pchips button[aria-pressed=true]{background:var(--p,var(--ink));color:var(--on-pos)}
.pchips button[data-p=All][aria-pressed=true]{background:var(--ink);color:var(--bg)}
.pchips button[aria-pressed=true] i{background:var(--on-pos)}
.fbtn{position:relative;border:0;border-radius:14px;height:42px;padding:0 12px;background:var(--ink);color:var(--bg);font:700 .86rem var(--num);display:flex;align-items:center;gap:6px}
.fbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.fbtn .n{background:var(--bg);color:var(--ink);border-radius:9px;min-width:18px;height:18px;display:grid;place-items:center;font-size:.72rem;padding:0 4px}

/* filter sheet */
dialog{border:0;padding:0;background:transparent;max-width:none;max-height:none;width:100%;margin:0;position:fixed;inset:auto 0 0 0;color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.sheet{max-width:560px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 16px)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h2{font:700 1.2rem var(--num);margin:0 0 10px}
.f{margin:0 0 14px}
.f label,.f .lab{display:flex;justify-content:space-between;font:600 .82rem var(--body);color:var(--ink2);margin-bottom:5px}
.f label output,.f .lab output{color:var(--ink);font:700 .95rem var(--num)}
.f select{width:100%;height:44px;border:0;border-radius:12px;background:var(--card2);padding:0 12px;font-size:16px}
.rng{position:relative;height:36px}
.rng input{position:absolute;left:0;right:0;width:100%;top:6px;margin:0;pointer-events:none;-webkit-appearance:none;appearance:none;background:none;height:24px}
.rng .track{position:absolute;left:0;right:0;top:16px;height:5px;border-radius:3px;background:var(--card2)}
.rng .fill{position:absolute;top:16px;height:5px;border-radius:3px;background:var(--ink)}
.rng input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:26px;height:26px;border-radius:50%;background:var(--ink);border:3px solid var(--card);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.rng input::-moz-range-thumb{pointer-events:auto;width:20px;height:20px;border-radius:50%;background:var(--ink);border:3px solid var(--card)}
.rng input::-webkit-slider-runnable-track{background:none} .rng input::-moz-range-track{background:none}
.tg{display:flex;align-items:center;justify-content:space-between;gap:10px;font:500 .95rem var(--body);margin:0 0 14px}
.tg input{width:46px;height:28px;appearance:none;-webkit-appearance:none;border-radius:14px;background:var(--card2);position:relative;margin:0;transition:background .15s}
.tg input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink2);transition:transform .15s,background .15s}
.tg input:checked{background:var(--ink)} .tg input:checked::after{transform:translateX(18px);background:var(--bg)}
.sheet .acts{display:flex;gap:8px}
.sheet .acts button{flex:1;height:46px;border:0;border-radius:14px;font-weight:600}
.sheet .reset{background:var(--card2)} .sheet .done{background:var(--ink);color:var(--bg)}


.views{margin:0 0 8px}
.lim{margin:0 0 10px;font:.8rem var(--body);color:var(--ink2)}
.lim summary{cursor:pointer;font:600 .75rem var(--body);color:var(--ink2);padding:4px 0}
.lim .lr{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.lim select{font:inherit;padding:4px 6px}
.lim .chip{border:1px solid var(--line,#8884);border-radius:99px;background:none;color:inherit;padding:2px 10px;font:inherit;cursor:pointer}
.tht{display:flex;justify-content:space-between;align-items:center;gap:8px}
.to .fx{background:var(--warn);color:#000;border-radius:3px;padding:0 4px;margin-right:4px;font:700 .55rem var(--num);text-transform:uppercase;font-style:normal}
.lim .kg{display:flex;align-items:center;gap:6px}
.limw{margin:8px 0;font-size:.8rem}
.px{font:600 .62rem var(--num);font-style:normal;border-radius:5px;padding:1px 5px;margin-left:5px;white-space:nowrap;display:inline-block}.px.act{background:var(--warn);color:#000}.px.soft{background:var(--card2);color:var(--ink2)}
button.fhb{font:600 .72rem var(--num);padding:5px 9px;border-radius:8px;border:0;background:var(--ink);color:var(--bg);margin-left:6px;cursor:pointer}
.pxw p{margin:0;font-size:.82rem}.pxw p b{font-weight:700}.pxw .pxf{font-size:.7rem;color:var(--ink2)}
.nts{display:flex;align-items:center;gap:6px;font:600 .72rem var(--body);color:var(--ink2)}.nts select{font:inherit;padding:3px 6px}
.to.co .tl{display:flex;flex-direction:column;gap:6px}.to.co .cl{display:flex;flex-direction:column;gap:1px}
.sqctl{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin:4px 0 10px}
.sqctl label{display:flex;flex-direction:column;gap:3px;font:600 .75rem var(--body);color:var(--ink2)}
.sqctl select{height:40px;border:0;border-radius:12px;background:var(--card);padding:0 10px;font-size:16px;color:var(--ink)}
.stp{display:flex;align-items:center;background:var(--card);border-radius:12px;height:40px}
.stp button{border:0;background:none;width:36px;height:40px;font:700 1.2rem var(--num)}
.stp output{font:700 1rem var(--num);min-width:62px;text-align:center}
.sqctl .primary{flex:1;min-width:140px;height:40px;border:0;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:600}
.sqsum{background:var(--card);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.sqsum b{display:block;font:700 1.35rem/1 var(--num);font-variant-numeric:tabular-nums}
.sqsum span{display:block;font-size:.72rem;color:var(--ink2);margin-top:3px;line-height:1.2}
.sqctl label.wide{flex:1 0 100%}.sqctl label.wide select{width:100%}
.med{position:absolute;top:-1px;left:-1px;width:19px;height:19px;border-radius:9px 0 8px 0;display:grid;place-items:center;background:var(--bad)}
.med.d{background:var(--warn)}
.med svg{width:11px;height:11px;stroke:#fff;stroke-width:3.4;stroke-linecap:round;fill:none}
.tile .new{position:absolute;top:2px;right:5px;font:700 .6rem var(--num);color:var(--p)}
.plan{background:var(--card);border-radius:14px;margin-bottom:8px;overflow:hidden}
.plan .ph{padding:9px 12px 4px;font:600 .78rem var(--body);color:var(--ink2)}
.plan button.pr{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:1fr auto auto auto;gap:4px 12px;align-items:center;width:100%;padding:9px 12px;border-top:1px solid var(--line)}
.plan button.pr:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
.plan button.pr[aria-pressed=true]{background:var(--card2)}
.plan .phd{display:grid;grid-template-columns:1fr auto auto auto;gap:4px 12px;padding:0 12px 4px;font:600 .7rem var(--body);color:var(--ink2)}
.plan .phd span:not(:first-child){text-align:right;min-width:44px}
.plan .k{font:600 .95rem var(--num)} .plan .k small{display:block;font:500 .72rem var(--body);color:var(--ink2)}
.plan .g,.plan .h,.plan .n{font:600 .95rem var(--num);text-align:right;font-variant-numeric:tabular-nums;min-width:44px}
.plan .h{color:var(--bad)} .plan .n{font-weight:700}
.plan .best{font:700 .62rem var(--num);background:var(--ink);color:var(--bg);padding:2px 5px;border-radius:5px;margin-left:6px;vertical-align:middle}
.moves{padding:6px 12px 10px;border-top:1px solid var(--line);display:grid;gap:5px;font-size:.88rem}
.mv{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}
.mv .o{color:var(--ink2)} .mv .i{font-weight:600;text-align:right} .mv .ar{color:var(--ink2)}
.mv small{display:block;color:var(--ink2);font:500 .72rem var(--num)}
.item.mine .row{background:color-mix(in srgb,var(--p,#888) 14%,transparent);box-shadow:inset 3px 0 0 var(--p,#888)}
.luctl{display:flex;gap:8px;align-items:end;margin-bottom:6px}.luctl label{flex:1;font:600 .7rem var(--num);color:var(--ink2)}.luctl select{width:100%;height:40px;border:0;border-radius:12px;background:var(--card);padding:0 10px;font-size:16px;color:var(--ink)}
.luctl button{height:36px;border:0;border-radius:10px;background:var(--card);padding:0 12px;font:600 .78rem var(--num);color:var(--ink)}
.lc2{background:var(--card);border-radius:14px;margin-bottom:5px;overflow:hidden}
.lh{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:8px;width:100%;padding:9px 12px;min-height:40px}
.lh:focus-visible{outline:3px solid var(--focus)}.lh b{font:700 1rem var(--num);width:40px}
.lf{font:500 .76rem var(--num);color:var(--ink2);flex:1}.ls{font:600 .76rem var(--num);color:var(--ink2)}
.lq{font:700 .7rem var(--num);padding:2px 7px;border-radius:8px}
.lq.hi{background:color-mix(in srgb,#2a9d5c 22%,transparent)}.lq.mid{background:color-mix(in srgb,#e0a21a 26%,transparent)}.lq.lo{background:color-mix(in srgb,#d64545 24%,transparent)}
.lbody{padding:0 12px 8px}.lg{display:grid;grid-template-columns:34px 1fr;gap:6px;padding:4px 0;border-top:1px solid var(--line)}
.lk{font:700 .62rem var(--num);color:var(--ink2);padding-top:5px}
.lr{display:grid;grid-template-columns:minmax(0,1fr) 46px 34px 28px;gap:6px;align-items:center;min-height:30px}
.lr .ln{font:600 .84rem var(--num);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 0}.lr b{font:700 .74rem var(--num);text-align:right}
.lr .ld{display:block;text-align:left;font:500 .66rem var(--num);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr.out{opacity:.55}.lr.out .ln{font-weight:500}.lr.mine .ln{box-shadow:inset 3px 0 0 var(--ink);padding-left:6px}
.lb{height:7px;border-radius:4px;background:var(--line);overflow:hidden;display:block}.lb i{display:block;height:100%;border-radius:4px}
.lb.hi i{background:#2a9d5c}.lb.mid i{background:#e0a21a}.lb.lo i{background:#d64545}
.lr small{font:500 .7rem var(--num);color:var(--ink2);text-align:right}.lm{font:600 .72rem var(--num);color:var(--ink2)}
.lr .med{position:static;display:inline-grid;width:12px;height:12px;border-radius:6px;vertical-align:-2px;margin-left:4px}.lr .med svg{width:7px;height:7px}
.rpk{margin-top:8px;background:var(--card);border-radius:12px;padding:8px}

<!--PREVIEW-->

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const POS = ['All','GKP','DEF','MID','FWD'];
let DEF_HZ = 8;
const state = {pos:'All', team:'', q:'', hz:8, avail:false, sort:'total', open:null, pmin:0, pmax:99, lo:0, hi:99, data:null, intro:true, vbase:'starter', view:'players', mine:-1, ft:1, plan:null, sel:null, budget:100, locked:new Set(), banned:new Set(), squad:null, srow:null, opt:null, wc:null, wcg:null, wcv:'fh', lug:0, luo:new Set(), rpl:null, repq:'', mo:{}, mp:null, mw:null, moves:[], optList:[], dall:3, dcap:{}, keepGk:true, nt:1, cheapGk:true, combo:null, copen:null, bkadj:{}, fhgw:null};
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

/* ---------- theme ---------- */
const root = document.documentElement;
function applyTheme(t){ if(t) root.setAttribute('data-theme', t); else root.removeAttribute('data-theme'); }
applyTheme(store.get('fpl.theme'));
function curTheme(){ return root.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light'); }

/* ---------- decrypt (AES-GCM, key from PBKDF2) ---------- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pkg, password){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(pkg.salt), iterations:pkg.iter, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const buf = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(pkg.iv)}, key, b64(pkg.ct));
  return JSON.parse(new TextDecoder().decode(buf));
}
async function fetchPkg(){
  const r = await fetch('data/predictions.enc.json', {cache:'no-store'});
  if(!r.ok) throw new Error('Projections have not been published yet.');
  return r.json();
}

/* ---------- boot ---------- */
async function boot(){
  const pv = document.getElementById('preview-data');
  if(pv){ start(JSON.parse(pv.textContent)); return; }
  $('#lock').hidden = false;
  const saved = store.get('fpl.pw');
  if(saved){ try{ start(await decrypt(await fetchPkg(), saved)); return; }catch(e){ store.del('fpl.pw'); } }
  $('#lockform').addEventListener('submit', async ev => {
    ev.preventDefault();
    const pw = $('#pw').value; $('#lockerr').textContent = '';
    try{
      const data = await decrypt(await fetchPkg(), pw);
      if($('#remember').checked) store.set('fpl.pw', pw);
      start(data);
    }catch(e){
      $('#lockerr').textContent = e.message && e.message.startsWith('Projections') ? e.message : 'That password did not work.';
    }
  });
}

/* ---------- app ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const out = p => p.status==='i' || p.status==='s' || p.status==='u' || p.status==='n';
const sum = (a,n) => a.slice(0,n).reduce((x,y)=>x+y,0);
const f1 = x => x.toFixed(1);

/* Once a gameweek's deadline has passed nothing can change for it, so drop it and plan from the next one (the data is rebuilt at the next run). */
const GWKEYS = ['ep','p_play','p60','pa','pc','pr','pst','psub','ms','mb','mins','fx'];
function advanceExpired(d){
  const now = Date.now(); let skipped = [];
  while(d.horizon.length>8 && d.deadlines && d.deadlines[d.horizon[0]] && now >= Date.parse(d.deadlines[d.horizon[0]])){
    skipped.push(d.horizon[0]); d.horizon.shift();
    d.players.forEach(p => { GWKEYS.forEach(k => { if(Array.isArray(p[k])) p[k] = p[k].slice(1); }); p.total = p.ep.reduce((a,b)=>a+b,0); });
    (d.teams||[]).forEach(t => { if(t.ft_next!=null){ t.ft = t.ft_next; } t.pending = 0; });
  }
  if(skipped.length){ d.notes = (d.notes||[]).concat([`Gameweek ${skipped.join(', ')} deadline${skipped.length>1?'s have':' has'} passed, so everything here starts from gameweek ${d.horizon[0]}. Transfers you make now count for gameweek ${d.horizon[0]}.`]); }
}
function start(d){
  advanceExpired(d);
  DEF_HZ = Math.min(8, d.horizon.length); d.hall = d.horizon.slice(); d.horizon = d.hall.slice(0, DEF_HZ);   // the data runs 16 weeks so the wildcard solver sees far enough; only the first 8 are shown
  state.data = d; state.hz = DEF_HZ; loadLimits(); loadBank(); loadFh(); moInit(d); moBar();
  const pr = d.players.map(p => p.price).filter(x => x != null);
  state.lo = state.pmin = Math.floor(Math.min(...pr)*10)/10; state.hi = state.pmax = Math.ceil(Math.max(...pr)*10)/10;
  $('#lock').hidden = true; $('#app').hidden = false;
  const g0 = d.horizon[0], g1 = d.horizon[d.horizon.length-1];
  const when = new Date(d.generated_at);
  $('#meta').textContent = `Gameweeks ${g0} to ${g1}. Updated ${when.toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}`;
  $('#pos').innerHTML = POS.map(p => `<button type="button" class="${p==='All'?'':'pos-'+p}" data-p="${p}" aria-pressed="${p===state.pos}">${p==='All'?'All':`<i></i>${p}`}</button>`).join('');
  const teams = [...new Set(d.players.map(p => p.team))].sort();
  $('#team').innerHTML = '<option value="">All teams</option>' + teams.map(t => `<option>${t}</option>`).join('');
  $('#hz').innerHTML = d.horizon.map((g,i) => `<option value="${i+1}">${i===0?'Next gameweek only':'Next '+(i+1)+' gameweeks'}</option>`).join('');
  $('#hz').value = state.hz; $('#sq-hz').innerHTML = $('#hz').innerHTML; $('#sq-hz').value = state.hz;
  $('#sq-team').innerHTML = '<option value="-1">A fresh squad (wildcard)</option>' + (d.teams||[]).map((t,i) => `<option value="${i}"${t.error?' disabled':''}>${esc(t.label)}${t.name?' \u00b7 '+esc(t.name):''}${t.error?' (not available on this run)':''}</option>`).join('');
  { const k=(d.teams||[]).findIndex(t=>!t.error); state.mine=k; if(k>=0&&d.teams[k].ft!=null) state.ft=d.teams[k].ft; }
  $('#sq-team').value=String(state.mine);
  for(const id of ['#pmin','#pmax']){ const e=$(id); e.min=state.lo; e.max=state.hi; }
  $('#pmin').value = state.pmin; $('#pmax').value = state.pmax; syncPrice();
  $('#s-next').textContent = 'GW ' + g0; loadPrices();
  { const pg=(d.progress||[]).map(x=>{ const s=x.played<x.matches?`${x.played}/${x.matches} played`:`all ${x.matches} played`;
      const st=x.played===0?'':(x.stats>=x.played?(x.played===x.matches?', stats in':', stats up to date'):`, stats in for ${x.stats}/${x.played}`);
      return `<span>GW${x.gw}: ${s}${st}</span>`; }).join(' \u00b7 ');
    $('#prog').innerHTML = pg; $('#prog').hidden = !pg; }
  const nn = d.notes.filter(x=>!x.startsWith('Penalty watch')); const n = nn.length ? nn.map(x=>`<p>${esc(x)}</p>`).join('') : '';
  $('#foot').innerHTML = n + `<p>Expected points under the official FPL scoring, from a team model plus a per-player model. Players with fewer than five league appearances are marked new: treat their numbers as rough. A small yellow card beside a name means the player is one or two yellows from a suspension (five by GW19); the projections already allow for the chance of him missing a game. Model ${esc(d.model_version)}.</p>`;
  render();
}

function syncPrice(){
  const a=+$('#pmin').value, b=+$('#pmax').value;
  state.pmin=Math.min(a,b); state.pmax=Math.max(a,b);
  const span=state.hi-state.lo||1;
  $('#pfill').style.left=((state.pmin-state.lo)/span*100)+'%';
  $('#pfill').style.right=(100-(state.pmax-state.lo)/span*100)+'%';
  $('#pout').textContent=`£${state.pmin.toFixed(1)}m to £${state.pmax.toFixed(1)}m`;
}
function activeFilters(){
  return (state.team?1:0) + ((state.pmin>state.lo||state.pmax<state.hi)?1:0) + (state.hz!==DEF_HZ?1:0) + (state.avail?1:0);
}

/* Value = points above a minimum-price player, per GBP m spent above the minimum price for that position.
   Replacement = average of the 3 best-projected fit players priced within 0.3m of the position's price floor. */
function replacement(hz){
  const d = state.data, res = {};
  for(const pos of Object.keys(d.floor)){
    const fit = d.players.filter(p => p.pos===pos && p.status==='a' && p.price!=null && p.p_play[0]>=0.6);
    let pool, price;
    if(state.vbase==='starter'){            // cheapest likely starters: the 3 lowest-priced fit players expected to play
      pool = fit.sort((x,y)=>x.price-y.price || sum(y.ep,hz)-sum(x.ep,hz)).slice(0,3);
      price = pool.length ? pool.reduce((t,p)=>t+p.price,0)/pool.length : d.floor[pos];
    }else{                                   // minimum price: best 3 fit players within 0.3m of the position's price floor
      pool = fit.filter(p => p.price<=d.floor[pos]+0.3).sort((x,y)=>sum(y.ep,hz)-sum(x.ep,hz)).slice(0,3);
      price = d.floor[pos];
    }
    res[pos] = {pts: pool.length ? pool.reduce((t,p)=>t+sum(p.ep,hz),0)/pool.length : 0, price};
  }
  return res;
}
function minSquad(){ const d=state.data; return Object.entries(d.squad).reduce((t,[k,n])=>t+n*d.floor[k],0); }
const sg = x => (x>=0?'+':'\u2212')+Math.abs(x).toFixed(1);

function ycInfo(p){
  const d=state.data, g=d.horizon[0]; if(!p.yc||!d.yc_rules) return null;
  const r=d.yc_rules.find(x=>p.yc<x[0]&&g<=x[1]); if(!r) return null;
  const left=r[0]-p.yc; if(left>2) return null;
  return {n:p.yc, left, at:r[0], gw:r[1], ban:r[2]};
}
function ycard(p){
  const y=ycInfo(p); if(!y) return '';
  const t=`${y.n} yellow cards: ${y.left===1?'one more':'two more'} in the games up to GW${y.gw} is a ${y.ban===1?'one-match':y.ban+'-match'} ban`+(p.yb?`. Already priced in: about ${Math.round(100*p.yb.slice(0,4).reduce((a,b)=>a+b,0))}% chance of missing a game in the next four gameweeks`:'');
  return `<span class="yc${y.left===1?' hot':''}" title="${t}" role="img" aria-label="${t}">${y.n}</span>`;
}
function flag(p){
  if(p.status==='a') return ycard(p) + (p.low_history ? '<span class="flag n" title="Few league appearances on record">new</span>' : '');
  const cls = p.status==='d' ? 'd' : 'o';
  const txt = {d:'doubt',i:'injured',s:'suspended',u:'unavailable',n:'left'}[p.status] || p.status;
  return `<span class="flag ${cls}" title="${esc(p.news)}">${txt}</span>` + ycard(p);
}

function render(){
  const d = state.data, hz = state.hz;
  let rows = d.players.filter(p =>
    (state.pos==='All' || p.pos===state.pos) && (!state.team || p.team===state.team) &&
    (!state.q || p.name.toLowerCase().includes(state.q)) && !(state.avail && out(p)) &&
    (p.price==null || (p.price>=state.pmin-1e-9 && p.price<=state.pmax+1e-9)));
  const rep_ = replacement(hz); state.rep = rep_;
  rows.forEach(p => {
    p._t = sum(p.ep,hz);
    p._pa = p._t - rep_[p.pos].pts;
    p._ex = p.price==null ? null : p.price - rep_[p.pos].price;
    p._v = p.price==null ? -99 : p._pa / Math.max(p._ex, 1);
  });
  // while a minutes panel is open the list keeps its order, so the row being edited does not jump away
  const kt = p => state.mp!=null ? sum(p.o.ep,hz) : p._t, kn = p => state.mp!=null ? p.o.ep[0] : p.ep[0];
  rows.sort((a,b) => state.sort==='next' ? kn(b)-kn(a) : state.sort==='value' ? b._v-a._v : kt(b)-kt(a));
  $('#s-total').setAttribute('aria-pressed', state.sort==='total');
  $('#s-next').setAttribute('aria-pressed', state.sort==='next');
  $('#s-value').setAttribute('aria-pressed', state.sort==='value');
  $('#s-total').textContent = hz===1 ? 'Next GW' : `Next ${hz} GWs`;
  $('#count').textContent = `${rows.length} player${rows.length===1?'':'s'}`;
  const nf = activeFilters(); $('#fn').hidden = !nf; $('#fn').textContent = nf;
  const T0 = curTeam(), mineSet = new Set(T0&&!T0.error&&T0.squad ? T0.squad.map(x=>x.code) : []);
  const shown = rows.slice(0,800);
  if(!shown.length){ $('#list').innerHTML = '<div class="empty">No players match these filters. Open Filters and press Reset.</div>'; return; }
  $('#list').className = state.intro ? 'intro' : '';
  $('#list').innerHTML = shown.map(p => {
    const bars = p.ep.slice(0,hz).map((e,i) => p.fx[i]==='BLANK'
      ? `<i class="off" style="--i:${i}" title="GW ${d.horizon[i]}: no fixture"></i>`
      : `<i class="${out(p)?'out':''}" style="--i:${i};height:${Math.max(2,Math.min(100,Math.round(e/9*100)))}%" title="GW ${d.horizon[i]} ${esc(p.fx[i])}: ${f1(e)}"></i>`).join('');
    const open = state.open===p.code;
    const nx = p.fx[0].split(', ')[0];
    return `<div class="item pos-${p.pos}${open?' open':''}${mineSet.has(p.code)?' mine':''}"><button class="row" data-c="${p.code}" aria-expanded="${open}">
      <span class="l1"><span class="chip">${p.pos}</span><span class="nm">${esc(p.name)}</span>${flag(p)}<span class="mt">${p.team}${p.price!=null?` <b>£${p.price.toFixed(1)}</b>`:''}${p.own!=null?` ${p.own.toFixed(1)}%`:''}</span></span>
      <span class="sc"><span class="strip" aria-hidden="true">${bars}</span><span class="nx">${esc(nx)}</span></span>
      <span class="tot">${state.sort==='value'
        ? `<div class="a">${p.price==null?'-':sg(p._v)}</div><div class="b">${sg(p._pa)} pts</div>`
        : state.sort==='next' && hz>1
        ? `<div class="a">${p.fx[0]==='BLANK'?'-':f1(p.ep[0])}</div><div class="b">${hz} GWs ${f1(p._t)}</div>`
        : `<div class="a">${f1(p._t)}</div><div class="b">${hz===1?'':'GW'+d.horizon[0]+' '+f1(p.ep[0])}</div>`}</span></button>
      <div class="dwrap"><div>${open?detail(p):''}</div></div></div>`;
  }).join('') + (rows.length>300?`<div class="empty">Showing the top 300 of ${rows.length}. Use the filters to narrow down.</div>`:'');
  state.intro = false;
}

const LABEL = {appearance:'Appearance',goals:'Goals',assists:'Assists',clean_sheet:'Clean sheet',goals_conceded:'Goals conceded',saves:'Saves',defensive:'Defensive contribution',cards:'Cards, own goals',bonus:'Bonus'};
function detail(p){
  const d = state.data;
  const comps = Object.entries(p.comp).filter(([k,v])=>LABEL[k] && Math.abs(v)>=0.005);
  const m = Math.max(1, ...comps.map(([,v])=>Math.abs(v)));
  const c = comps.map(([k,v]) => `<span>${LABEL[k]}</span><span class="bar"><span class="${v<0?'neg':''}" style="width:${Math.round(Math.abs(v)/m*100)}%"></span></span><span class="t">${v.toFixed(2)}</span>`).join('');
  const g = p.ep.slice(0,d.horizon.length).map((e,i) => `<div><div class="g">GW ${d.horizon[i]}</div><div class="e">${f1(e)}</div><div class="o">${p.fx[i]==='BLANK'?'no game':esc(p.fx[i])}</div></div>`).join('');
  return `<div class="detail"><div><h3>Each gameweek</h3><div class="gws">${g}</div>
    <div class="info"><button type="button" class="mbtn" data-mp="${p.code}" aria-pressed="${state.mp===p.code}">Adjust minutes</button> Chance of playing GW ${d.horizon[0]}: ${Math.round(p.p_play[0]*100)}%.${p.sd?` Typical spread: ±${p.sd.toFixed(1)}.`:''}${p.news?' '+esc(p.news):''}</div>${state.mp===p.code?minsPanel(p):''}${penInfo(p)}</div>
    <div><h3>Where GW ${d.horizon[0]} points come from</h3><div class="comp">${c}</div></div>
    ${p.price==null?'':`<div class="valbox"><h3>Value over ${state.vbase==='starter'?'the cheapest likely starter':'a minimum-price player'} (${p.pos})</h3>
      <div class="vgrid"><div><b>${sg(p._pa)}</b><span>points over ${state.hz===1?'the gameweek':state.hz+' gameweeks'}</span></div>
      <div><b>${sg(p._ex)}m</b><span>${state.vbase==='starter'?'more than':'above the minimum of'} £${state.rep[p.pos].price.toFixed(1)}m</span></div>
      <div><b>${sg(p._v)}</b><span>points per £m extra</span></div></div>
      <div class="info">The baseline is ${state.vbase==='starter'?'the average of the three cheapest fit '+p.pos+'s expected to play':'the best three fit '+p.pos+'s within £0.3m of the minimum price'}: ${f1(state.rep[p.pos].pts)} points over the same period. Extra spend counts as at least £1.0m so tiny price gaps do not inflate the score.</div></div>`}</div>`;
}

/* ---------- squad building ---------- */
/* Maximise, over the chosen gameweeks, the best legal XI each week plus a doubled captain, with a small weight on the
   bench. Constraints: 15 players split 2/5/5/3, budget, at most 3 per club, locked players kept, banned players excluded.
   Solved by randomised restarts + best-improvement swaps over a pruned candidate list; tests/exact_squad.py compares it with an exact MILP (gap well under 1%). */
const MINXI = {DEF:3, MID:2, FWD:1};
/* Optional limit on goalkeepers and defenders from one club (all clubs, or club by club). Default is the game's own limit of three players per club. */
const capFor = t => Math.min(3, state.dcap[t]!==undefined ? state.dcap[t] : state.dall);
const isDef = pos => pos==='DEF' || pos==='GKP';          // goalkeepers count with defenders for the club limit
const benchGk = (sq, hz) => { const g = sq.filter(p=>p.pos==='GKP'); return g.length<2 ? null : g.reduce((a,b)=>sum(b.ep,hz)<sum(a.ep,hz)?b:a).code; };   // the spare keeper
const defCounts = sq => { const c = {}; for(const o of sq) if(isDef(o.pos)) c[o.team] = (c[o.team]||0)+1; return c; };
const defExcess = sq => { const c = defCounts(sq); let e = 0; for(const t in c) e += Math.max(0, c[t]-capFor(t)); return e; };
const defOver = sq => { const c = {}; for(const o of sq) if(isDef(o.pos)){ c[o.team]=(c[o.team]||0)+1; if(c[o.team]>capFor(o.team)) return true; } return false; };
const BENCH_W = 0.1;
const BENCH_ORD = [1.6, 0.9, 0.5];           // first sub is called on far more often than the third, so each place down the bench counts for less (average stays near 1)
const BANK_W = 0.3;                         // points per £1m left in the bank, a tie-breaker only

    for(const i of sq) by[i.pos].push(E[i.k][g]);

function solveSquad(data, hz, budget, locked, banned, restarts, owned, opts){

/* Per-gameweek XI: the same rule lineupScore uses (best legal XI by projected points, captain on the top scorer, doubled). */
function pickGW(squad, g){
  const by = {GKP:[],DEF:[],MID:[],FWD:[]};
  squad.forEach(p => by[p.pos].push(p)); for(const k in by) by[k].sort((a,b)=>b.ep[g]-a.ep[g]);
  const xi = [by.GKP[0]], rest = [];
  for(const k of ['DEF','MID','FWD']) by[k].forEach((p,j) => (j<MINXI[k] ? xi : rest).push(p));
  rest.sort((a,b)=>b.ep[g]-a.ep[g]);
  const flex = rest.slice(0,4); flex.forEach(p=>xi.push(p));
  const cap = xi.reduce((a,b)=>b.ep[g]>a.ep[g]?b:a);
  const cut = flex.length ? flex[flex.length-1].ep[g] : 0;      // last place in the XI among the free choices

function moInit(d){

      if(p.p60[g]>=0.15){ kn += p.pc[g]; kd += p.p60[g]; }

/* row = [now_cost, progress, projected tonight, likelihood, projected tomorrow, likelihood, projected the day after, likelihood, (1 = not reliable yet)].

function pxInfo(p){

  const moved = r[0] - Math.round(p.price*10), ok = r.length < 9;
  const lvl = v => v>=100 ? 2 : v<=-100 ? -2 : v>=85 ? 1 : v<=-85 ? -1 : 0;     // 2 / -2 change expected, 1 / -1 close to one

function pxBadge(p, role){          // role: 'in' = being bought, 'out' = being sold or already owned
  const i = pxInfo(p); if(!i) return '';

  if(i.moved) return b('act', `price now £${i.now.toFixed(1)}m`);
  if(role==='in'){
    if(i.night===2) return b('act', 'rises tonight: buy before midnight');
    if(i.night===-2) return b('soft', 'falls tonight: waiting saves £0.1m');
    if(i.night===1) return b('soft', 'close to rising');
    if(i.night===-1) return b('soft', 'close to falling');

    if(i.next===-1) return b('soft', 'falls tomorrow');

const LV_EV = [['goals_scored','g'],['assists','a'],['own_goals','og'],['penalties_saved','ps'],['penalties_missed','pm'],['yellow_cards','yc'],['red_cards','rc']];

function lvBonus(fixtures){
  const out = new Map();

    if(!f.started) continue;
    const st = lvStat(f), official = new Map();
    for(const side of ['h','a']) for(const x of ((st.bonus||{})[side]||[])) official.set(x.element, x.value);
    if(official.size){ out.set(f.id, official); continue; }
    const bps = []; for(const side of ['h','a']) for(const x of ((st.bps||{})[side]||[])) bps.push([x.element, x.value]);
    const res = new Map();
    for(const [el,v] of bps){ const place = bps.filter(([,w]) => w>v).length, b = [3,2,1][place] || 0; if(b) res.set(el,b); }

}

  for(const e of live.elements||[]){
    let pts = 0, bon = 0;
    for(const ex of e.explain||[]){

  let bench = ps.filter(p => p.position>11).sort((a,b)=>a.position-b.position).map(p => p.element);

function loadLive(force){

  let src = 'file';
  const first = FPL_PROXY ? liveFromApi().then(j => { src = 'api'; return j; }).catch(() => { src = 'file'; return fromFile(); }) : fromFile();
  return first.then(j => { state.live = j || state.live || null; state.liveSrc = src; }).catch(() => {}).then(() => { state.liveBusy = false; state.liveTried = true; if(state.view==='live') renderLive(); });

const lvTime = iso => { try { return new Date(iso).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); } catch(e){ return ''; } };

  const bits = [['Goals',group(['g'])],['Assists',group(['a'])],['Own goals',group(['og'])],['Pens missed',group(['pm'])],['Pens saved',group(['ps'])],['Yellow',group(['yc'])],['Red',group(['rc'])]];

}

    return `<div class="lv-t">${lgs.length>1 ? `<select id="lv-lg" aria-label="League">${lgs.map(x=>`<option value="${x.id}"${x.id===G.id?' selected':''}>${esc(x.name)}</option>`).join('')}</select>` : `<div class="lv-bn" style="margin:0 0 4px">${esc(G.name)}</div>`}
      <table class="lv-lg">${now.map((r,i)=>{ const d = preRank.get(r.e)-(i+1);
        return `<tr data-lk="${r.e}"${mineIds.has(r.e)?' class="me"':''}${r.t?' style="cursor:pointer"':''}><td>${i+1}<span class="mv ${d>0?'u':d<0?'d':''}">${d>0?'&#9650;'+d:d<0?'&#9660;'+(-d):''}</span></td><td class="n">${esc(r.n)}<small>${esc(r.m)}${r.chip?' &middot; '+esc(({bboost:'Bench boost',freehit:'Free hit','3xc':'Triple captain',wildcard:'Wildcard'}[r.chip]||r.chip)):''}</small></td><td class="r">${r.left ?? '-'}<small>to play</small></td><td class="r">${r.gw ?? '-'}<small>GW</small></td><td class="r">${r.tot}<small>total</small></td></tr>${r.t && state.liveOpen===r.e ? `<tr class="lv-x"><td colspan="5"><div class="lv-sq">${squad(r.t)}</div></td></tr>` : ''}`; }).join('')}</table>${now.some(r=>r.t) ? '<div class="lv-hint">Tap a manager to see their team</div>' : ''}</div>`;
